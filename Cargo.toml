[package]
name = "ksef"
version = "0.7.3"
edition = "2024"
authors = ["Ireneusz Witek"]
license = "MIT"
description = "Communication with the API of the digital platform for managing e-Invoicing in Poland (KSeF 2.0)"
readme = "README.md"
keywords = ["ksef", "client"]
categories = ["api-bindings","web-programming::http-client"]
repository = "https://github.com/ireneuszwitek/ksef-client-rust"

exclude = ["target/", ".gitignore"]

[lib]
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["full"] }
chrono = { version = "0.4", features = ["serde"]} 
base64 = "0.21"
rsa = "0.9"
sha2 = "0.10"
rand = "0.8"
pem-rfc7468 = "1.0"
x509-parser = "0.18"
urlencoding = "2.1"
aes = "0.8"
block-modes = "0.8"
block-padding = "0.2"
zip = "8.1"
qrcode = "0.14"
image = "0.24"
cbc = "0.1"
cipher = { version = "0.4", features = ["alloc"] }

[dev-dependencies]
http = "1.4"